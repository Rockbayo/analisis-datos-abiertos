<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Análisis de datos abiertos{% endblock %} · Cielos abiertos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <aside id="sidebar" class="sidebar" aria-label="Menú principal">
    <div class="sidebar-brand">
      <span class="brand-icon" aria-hidden="true"><i class="bi bi-airplane-fill"></i></span>
      <span class="brand-text">Cielos abiertos<span class="brand-sub">Datos abiertos</span></span>
    </div>
    <nav class="sidebar-nav" aria-label="Secciones">
      <div class="nav-label">General</div>
      <a class="nav-link {% if endpoint_actual == 'inicio' %}active{% endif %}" href="/" {% if endpoint_actual == 'inicio' %}aria-current="page"{% endif %}>
        <i class="bi bi-house" aria-hidden="true"></i><span>Resumen</span>
      </a>
      <div class="nav-label">Análisis</div>
      <a class="nav-link {% if endpoint_actual == 'poblacional' %}active{% endif %}" href="/analisis/poblacional" {% if endpoint_actual == 'poblacional' %}aria-current="page"{% endif %}>
        <i class="bi bi-people" aria-hidden="true"></i><span>Poblacional</span>
      </a>
      <a class="nav-link {% if endpoint_actual == 'territorial' %}active{% endif %}" href="/analisis/territorial" {% if endpoint_actual == 'territorial' %}aria-current="page"{% endif %}>
        <i class="bi bi-globe-americas" aria-hidden="true"></i><span>Territorial</span>
      </a>
      <a class="nav-link {% if endpoint_actual == 'temporal' %}active{% endif %}" href="/analisis/temporal" {% if endpoint_actual == 'temporal' %}aria-current="page"{% endif %}>
        <i class="bi bi-clock-history" aria-hidden="true"></i><span>Temporal</span>
      </a>
    </nav>
    <div class="sidebar-footer"><span>v1.0</span><span class="footer-dot" aria-hidden="true"></span><span>Datos abiertos</span></div>
  </aside>

  <div class="app-main">
    <header class="topbar sticky-top">
      <p class="topbar-title mb-0">{% block titulo_barra %}Análisis de datos abiertos{% endblock %}</p>
    </header>
    <main class="content">
      <div class="page">
        {% block contenido %}{% endblock %}
      </div>
    </main>
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
