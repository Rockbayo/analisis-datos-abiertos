<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<button id="btnMenu" class="menu-toggle" type="button"
        aria-label="Abrir menú" aria-expanded="false" aria-controls="panelMenu">☰</button>

<aside id="panelMenu" class="menu-panel">
  <p class="menu-titulo">Población y territorio</p>
  <nav>
    <a class="menu-link {{ 'activo' if endpoint_actual == 'inicio' }}" href="{{ url_for('inicio') }}">Inicio</a>

    <details id="grupoAnalisis" class="grupo"
             {{ 'open' if endpoint_actual in ['poblacional', 'territorial', 'temporal', 'relacional'] }}>
      <summary class="menu-link">Análisis de datos <span class="flecha">▾</span></summary>
      <div class="sub-lista">
        <a class="menu-link sub {{ 'activo' if endpoint_actual == 'poblacional' }}" href="{{ url_for('poblacional') }}">Dimensión poblacional</a>
        <a class="menu-link sub {{ 'activo' if endpoint_actual == 'territorial' }}" href="{{ url_for('territorial') }}">Dimensión territorial</a>
        <a class="menu-link sub {{ 'activo' if endpoint_actual == 'temporal' }}" href="{{ url_for('temporal') }}">Dimensión temporal</a>
        <a class="menu-link sub {{ 'activo' if endpoint_actual == 'relacional' }}" href="{{ url_for('relacional') }}">Dimensión relacional y multivariada</a>
      </div>
    </details>
  </nav>
</aside>

<main class="contenedor tarjeta">
  {% block contenido %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const btn = document.getElementById('btnMenu');
  const panel = document.getElementById('panelMenu');
  const grupo = document.getElementById('grupoAnalisis');
  let espera;

  function abrir() {
    panel.classList.add('abierto');
    btn.setAttribute('aria-expanded', 'true');
  }
  function cerrar() {
    panel.classList.remove('abierto');
    grupo.removeAttribute('open');
    btn.setAttribute('aria-expanded', 'false');
  }

  btn.addEventListener('click', () =>
    panel.classList.contains('abierto') ? cerrar() : abrir());

  // Se retrae al usarlo: clic en un enlace, clic afuera, Escape o al sacar el mouse
  panel.querySelectorAll('a').forEach(a => a.addEventListener('click', cerrar));
  document.addEventListener('click', e => {
    if (!panel.contains(e.target) && !btn.contains(e.target)) cerrar();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });
  panel.addEventListener('mouseleave', () => { espera = setTimeout(cerrar, 1500); });
  panel.addEventListener('mouseenter', () => clearTimeout(espera));
</script>
{% block scripts %}{% endblock %}
</body>
</html>
