<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Población y territorio{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
  /* ===== MENÚ LATERAL (autónomo) ===== */
  #skyToggle, #skyMenu{
    --bg:#004B5C;      /* color del panel */
    --bg2:#003B49;     /* color del submenú */
    --linea:#1E7686;   /* líneas divisorias */
    --texto:#ffffff;
  }

  /* Botón que abre el menú */
  #skyToggle{
    position:fixed;top:14px;left:14px;z-index:1900;
    width:54px;height:54px;padding:0;display:grid;place-content:center;gap:6px;
    border:0;border-radius:10px;background:var(--bg);color:var(--texto);cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  #skyToggle span,#skyCerrar span{display:block;width:30px;height:4px;border-radius:4px;background:currentColor}

  #skyBackdrop{
    position:fixed;inset:0;z-index:1950;background:rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  #skyBackdrop.on{opacity:1;pointer-events:auto}

  /* Panel */
  #skyMenu,#skyMenu *{box-sizing:border-box;margin:0;padding:0}
  #skyMenu{
    position:fixed;top:0;left:0;bottom:0;z-index:2000;
    width:min(340px,88vw);display:flex;flex-direction:column;overflow-y:auto;
    background:var(--bg);color:var(--texto);
    font-family:'Nunito','Segoe UI',sans-serif;
    box-shadow:12px 0 40px rgba(0,0,0,.5);
    transform:translateX(-102%);visibility:hidden;
    transition:transform .3s ease,visibility 0s linear .3s;
  }
  #skyMenu.on{transform:none;visibility:visible;transition:transform .3s ease,visibility 0s}

  /* Cabecera: "Menú" + hamburguesa */
  #skyMenu .sky-cab{
    display:flex;align-items:center;justify-content:space-between;
    min-height:84px;padding:0 24px;border-bottom:2px solid var(--linea);
  }
  #skyMenu .sky-cab strong{font-size:28px;font-weight:800;letter-spacing:.01em}
  #skyCerrar{
    display:grid;gap:6px;width:40px;height:40px;place-content:center;
    border:0;background:transparent;color:var(--texto);cursor:pointer;
  }

  /* Opciones */
  #skyMenu .sky-link{
    display:flex;align-items:center;gap:20px;width:100%;min-height:72px;
    padding:0 24px;border:0;border-bottom:2px solid var(--linea);
    background:transparent;color:var(--texto);
    font:inherit;font-size:20px;font-weight:600;line-height:1.25;
    text-decoration:none;text-align:left;cursor:pointer;list-style:none;
    transition:background .2s;
  }
  #skyMenu .sky-link:hover{background:rgba(255,255,255,.07)}
  #skyMenu .sky-link.activo{background:rgba(255,255,255,.12);box-shadow:inset 5px 0 0 #fff}
  #skyMenu .sky-ico{flex:0 0 28px;width:28px;height:28px;fill:currentColor}

  /* Grupo desplegable */
  #skyMenu summary::-webkit-details-marker{display:none}
  #skyMenu summary::marker{content:""}
  #skyMenu .sky-flecha{
    margin-left:auto;width:10px;height:10px;
    border-right:3px solid currentColor;border-bottom:3px solid currentColor;
    transform:rotate(-45deg);transition:transform .2s;
  }
  #skyMenu details[open] .sky-flecha{transform:rotate(45deg)}

  #skyMenu .sky-sub{background:var(--bg2)}
  #skyMenu .sky-sub .sky-link{
    min-height:60px;padding-left:40px;font-size:17px;font-weight:400;
    border-bottom:1px solid var(--linea);
  }
  #skyMenu .sky-sub .sky-ico{flex-basis:22px;width:22px;height:22px;opacity:.9}

  #skyToggle:focus-visible,#skyCerrar:focus-visible,#skyMenu a:focus-visible,#skyMenu summary:focus-visible{
    outline:3px solid #fbbf24;outline-offset:-3px;
  }
  @media (prefers-reduced-motion: reduce) { #skyMenu, #skyBackdrop, #skyMenu * { transition: none !important; } }

  /* Contenedor de la página */
  .pagina{max-width:1200px;margin:0 auto;padding:5rem clamp(1rem,4vw,3rem) 3rem}
  </style>
</head>
<body>

  <!-- Botón que abre el menú -->
  <button id="skyToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="skyMenu">
    <span></span><span></span><span></span>
  </button>
  <div id="skyBackdrop"></div>

  <!-- Panel del menú -->
  <aside id="skyMenu" aria-label="Menú principal">

    <div class="sky-cab">
      <strong>Menú</strong>
      <button id="skyCerrar" aria-label="Cerrar menú">
        <span></span><span></span><span></span>
      </button>
    </div>

    <nav>
      <a href="/" class="sky-link">
        <svg class="sky-ico" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Inicio
      </a>

      <details open>
        <summary class="sky-link">
          <svg class="sky-ico" viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
          Análisis de datos
          <span class="sky-flecha"></span>
        </summary>

        <div class="sky-sub">
          <a href="/analisis/poblacional" class="sky-link">
            <svg class="sky-ico" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            Dimensión poblacional
          </a>
          <a href="/analisis/territorial" class="sky-link">
            <svg class="sky-ico" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            Dimensión territorial
          </a>
          <a href="/analisis/temporal" class="sky-link">
            <svg class="sky-ico" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            Dimensión temporal
          </a>
          <a href="/analisis/relacional" class="sky-link">
            <svg class="sky-ico" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
            Dimensión relacional y multivariada
          </a>
        </div>
      </details>
    </nav>
  </aside>

  <!-- Contenido de cada página -->
  <main class="pagina">
    {% block contenido %}{% endblock %}
  </main>

  <script>
  (function () {
    var btn = document.getElementById('skyToggle');
    var cerrarBtn = document.getElementById('skyCerrar');
    var menu = document.getElementById('skyMenu');
    var fondo = document.getElementById('skyBackdrop');

    function abrir(si) {
      menu.classList.toggle('on', si);
      fondo.classList.toggle('on', si);
      btn.setAttribute('aria-expanded', si ? 'true' : 'false');
      document.body.style.overflow = si ? 'hidden' : '';
    }

    btn.addEventListener('click', function () { abrir(true); });
    cerrarBtn.addEventListener('click', function () { abrir(false); });
    fondo.addEventListener('click', function () { abrir(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') abrir(false); });

    var ruta = location.pathname.replace(/\/$/, '') || '/';
    menu.querySelectorAll('a.sky-link').forEach(function (a) {
      a.addEventListener('click', function () { abrir(false); });
      var h = (a.getAttribute('href') || '').replace(/\/$/, '') || '/';
      if (h === ruta) a.classList.add('activo');
    });
  })();
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
